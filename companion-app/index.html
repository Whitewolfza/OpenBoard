<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OpenBoard Companion</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --primary: #0f3460;
      --accent: #e94560;
      --text: #eaeaea;
      --text-dim: #8a8a9a;
      --border: #2a2a4a;
      --radius: 10px;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      flex: 1;
    }

    #statusDot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #444;
      flex-shrink: 0;
    }
    #statusDot.connected { background: #4caf50; }
    #statusDot.error     { background: var(--accent); }

    #statusLabel { font-size: 0.8rem; color: var(--text-dim); }

    /* ── Connect screen ──────────────────────────────────────────── */
    #connectScreen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 16px;
    }

    #connectScreen h2 { font-size: 1.3rem; }
    #connectScreen p  { color: var(--text-dim); text-align: center; font-size: 0.9rem; }

    .field-group {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label { font-size: 0.85rem; color: var(--text-dim); }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 1rem;
    }
    input:focus { outline: 2px solid var(--accent); border-color: transparent; }

    .btn {
      padding: 11px 20px;
      border: none;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.75; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--primary); color: var(--text); }
    .btn-small { padding: 6px 12px; font-size: 0.8rem; }
    .btn-danger  { background: #7f1d1d; color: #fca5a5; }

    /* ── Main app ────────────────────────────────────────────────── */
    #appScreen {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }
    #appScreen.visible { display: flex; }

    /* Preview */
    #previewArea {
      position: relative;
      background: #000;
      cursor: crosshair;
      flex-shrink: 0;
    }

    #boardPreview {
      width: 100%;
      display: block;
    }

    #pointerDot {
      position: absolute;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: rgba(233, 69, 96, 0.8);
      border: 2px solid #fff;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
      transition: left 0.05s, top 0.05s;
    }

    /* Page strip */
    #pageStrip {
      display: flex;
      gap: 6px;
      padding: 8px 10px;
      overflow-x: auto;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .page-thumb {
      width: 60px; height: 45px;
      border-radius: 5px;
      background: #2a2a4a;
      border: 2px solid transparent;
      cursor: pointer;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: var(--text-dim);
    }
    .page-thumb.active { border-color: var(--accent); }
    .page-thumb img { width: 100%; height: 100%; object-fit: cover; }

    /* Controls */
    #controls {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .control-label {
      font-size: 0.8rem;
      color: var(--text-dim);
      width: 70px;
      flex-shrink: 0;
    }

    /* Nav buttons */
    .nav-btn {
      flex: 1;
      min-width: 70px;
      text-align: center;
      padding: 10px;
      background: var(--primary);
      border-radius: var(--radius);
      border: none;
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
    }
    .nav-btn:active { opacity: 0.7; }

    #pageIndicator {
      font-size: 0.9rem;
      color: var(--text-dim);
      min-width: 60px;
      text-align: center;
    }

    /* Tool buttons */
    .tool-btn {
      padding: 8px 14px;
      background: var(--primary);
      border: 2px solid transparent;
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.85rem;
      cursor: pointer;
    }
    .tool-btn.active { border-color: var(--accent); background: #1a1040; }
    .tool-btn:active { opacity: 0.7; }

    /* Color picker */
    #colorPicker { width: 44px; height: 38px; padding: 2px; border-radius: 6px; border: none; cursor: pointer; background: transparent; }

    /* Info bar */
    #infoBar {
      font-size: 0.75rem;
      color: var(--text-dim);
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .info-chip {
      background: var(--surface);
      padding: 4px 10px;
      border-radius: 99px;
      border: 1px solid var(--border);
    }

    /* Error message */
    #errorMsg {
      color: #f87171;
      font-size: 0.85rem;
      text-align: center;
      min-height: 20px;
    }
  </style>
</head>
<body>

<!-- Header (always visible once connected) -->
<header>
  <h1>OpenBoard Companion</h1>
  <div id="statusDot"></div>
  <span id="statusLabel">Disconnected</span>
</header>

<!-- ── Connect screen ───────────────────────────────────────────── -->
<div id="connectScreen">
  <h2>Connect to OpenBoard</h2>
  <p>Enter the IP address and port of the computer running OpenBoard,<br>
     then enter the PIN displayed in OpenBoard.</p>

  <div class="field-group">
    <label for="hostInput">Host (IP address)</label>
    <input id="hostInput" type="text" placeholder="192.168.1.x" value="" />

    <label for="portInput">Port</label>
    <input id="portInput" type="number" placeholder="4444" value="4444" min="1" max="65535" />

    <label for="pinInput">PIN</label>
    <input id="pinInput" type="text" placeholder="123456" maxlength="6" />

    <div id="errorMsg"></div>
    <button class="btn btn-primary" onclick="connect()">Connect</button>
  </div>
</div>

<!-- ── Main app screen ──────────────────────────────────────────── -->
<div id="appScreen">

  <!-- Board preview -->
  <div id="previewArea">
    <img id="boardPreview" src="" alt="Board preview" draggable="false" />
    <div id="pointerDot"></div>
  </div>

  <!-- Page thumbnail strip -->
  <div id="pageStrip"></div>

  <!-- Controls -->
  <div id="controls">

    <!-- Page navigation -->
    <div class="control-row">
      <span class="control-label">Pages</span>
      <button class="nav-btn" onclick="sendCmd({cmd:'prev_page'})" title="Previous">◀</button>
      <span id="pageIndicator">– / –</span>
      <button class="nav-btn" onclick="sendCmd({cmd:'next_page'})" title="Next">▶</button>
    </div>

    <!-- Tools -->
    <div class="control-row">
      <span class="control-label">Tool</span>
      <button class="tool-btn" id="tool-pen"     onclick="setTool('pen')">✏️ Pen</button>
      <button class="tool-btn" id="tool-marker"  onclick="setTool('marker')">🖊 Marker</button>
      <button class="tool-btn" id="tool-eraser"  onclick="setTool('eraser')">🧹 Eraser</button>
      <button class="tool-btn" id="tool-pointer" onclick="setTool('pointer')">👆 Pointer</button>
    </div>

    <!-- Color -->
    <div class="control-row">
      <span class="control-label">Color</span>
      <input type="color" id="colorPicker" value="#ff0000" onchange="setColor(this.value)" />
      <span id="colorLabel" style="font-size:0.85rem; color: var(--text-dim);">#ff0000</span>
    </div>

    <!-- Actions -->
    <div class="control-row">
      <span class="control-label">Actions</span>
      <button class="btn btn-danger btn-small" onclick="clearBoard()">🗑 Clear</button>
      <button class="btn btn-secondary btn-small" onclick="sendCmd({cmd:'get_state'})">↻ Refresh</button>
      <button class="btn btn-secondary btn-small" onclick="disconnect()">Disconnect</button>
    </div>

    <!-- Info -->
    <div id="infoBar">
      <span class="info-chip" id="infoTool">Tool: –</span>
      <span class="info-chip" id="infoZoom">Zoom: –</span>
    </div>

  </div>
</div>

<script>
  // ── State ───────────────────────────────────────────────────────
  let ws = null;
  let currentPage = 1;
  let totalPages = 1;
  let currentTool = 'pen';
  let pendingPin = '';
  let pageThumbs = {}; // page number → base64 jpeg (cached preview of current page only for now)

  // ── Connection ──────────────────────────────────────────────────
  function connect() {
    const host = document.getElementById('hostInput').value.trim();
    const port = parseInt(document.getElementById('portInput').value.trim(), 10) || 4444;
    pendingPin = document.getElementById('pinInput').value.trim();

    if (!host) { showError('Please enter a host address.'); return; }
    if (!pendingPin) { showError('Please enter the PIN.'); return; }

    showError('');
    setStatus('connecting', 'Connecting…');

    const url = `ws://${host}:${port}`;
    ws = new WebSocket(url);

    ws.onopen = () => setStatus('connecting', 'Authenticating…');

    ws.onmessage = (ev) => handleMessage(JSON.parse(ev.data));

    ws.onerror = () => {
      showError('Connection failed. Check host/port and that OpenBoard is running.');
      setStatus('error', 'Error');
    };

    ws.onclose = () => {
      setStatus('', 'Disconnected');
      showConnectScreen();
    };
  }

  function disconnect() {
    if (ws) ws.close();
  }

  // ── Message handling ────────────────────────────────────────────
  function handleMessage(msg) {
    switch (msg.type) {
      case 'auth_required':
        // Server asked for PIN – send it
        ws.send(JSON.stringify({ pin: pendingPin }));
        break;

      case 'auth_ok':
        setStatus('connected', 'Connected');
        showAppScreen();
        break;

      case 'auth_fail':
        showError('Incorrect PIN. Please try again.');
        setStatus('error', 'Auth failed');
        ws.close();
        break;

      case 'preview':
        updatePreview(msg.image, msg.page, msg.total);
        break;

      case 'page_changed':
        updatePageInfo(msg.page, msg.total);
        break;

      case 'state':
        if (msg.tool)  updateTool(msg.tool);
        if (msg.color) updateColor(msg.color);
        if (msg.zoom)  updateZoom(msg.zoom);
        break;
    }
  }

  // ── Commands ────────────────────────────────────────────────────
  function sendCmd(obj) {
    if (ws && ws.readyState === WebSocket.OPEN)
      ws.send(JSON.stringify(obj));
  }

  function setTool(name) {
    sendCmd({ cmd: 'set_tool', tool: name });
  }

  function setColor(hex) {
    sendCmd({ cmd: 'set_color', color: hex });
    document.getElementById('colorLabel').textContent = hex;
  }

  function clearBoard() {
    if (confirm('Clear the current board page?'))
      sendCmd({ cmd: 'clear' });
  }

  // ── Preview pointer ─────────────────────────────────────────────
  const previewArea = document.getElementById('previewArea');
  const pointerDot  = document.getElementById('pointerDot');

  previewArea.addEventListener('pointermove', (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const rect = previewArea.getBoundingClientRect();
    const nx = (e.clientX - rect.left)  / rect.width;
    const ny = (e.clientY - rect.top)   / rect.height;
    sendCmd({ cmd: 'pointer', x: +nx.toFixed(4), y: +ny.toFixed(4) });
    pointerDot.style.left = (nx * 100) + '%';
    pointerDot.style.top  = (ny * 100) + '%';
    pointerDot.style.display = 'block';
  });

  previewArea.addEventListener('pointerleave', () => {
    pointerDot.style.display = 'none';
  });

  // ── UI updates ──────────────────────────────────────────────────
  function updatePreview(base64, page, total) {
    const img = document.getElementById('boardPreview');
    img.src = 'data:image/jpeg;base64,' + base64;
    pageThumbs[page] = base64;
    updatePageInfo(page, total);
    rebuildPageStrip();
  }

  function updatePageInfo(page, total) {
    currentPage = page;
    totalPages  = total;
    document.getElementById('pageIndicator').textContent = `${page} / ${total}`;
    rebuildPageStrip();
  }

  function rebuildPageStrip() {
    const strip = document.getElementById('pageStrip');
    // Only rebuild if count changed
    if (strip.children.length !== totalPages) {
      strip.innerHTML = '';
      for (let i = 1; i <= totalPages; i++) {
        const div = document.createElement('div');
        div.className = 'page-thumb' + (i === currentPage ? ' active' : '');
        div.dataset.page = i;
        if (pageThumbs[i]) {
          const im = document.createElement('img');
          im.src = 'data:image/jpeg;base64,' + pageThumbs[i];
          div.appendChild(im);
        } else {
          div.textContent = i;
        }
        div.addEventListener('click', () => sendCmd({ cmd: 'goto_page', page: i }));
        strip.appendChild(div);
      }
    } else {
      // Just update active class and images
      Array.from(strip.children).forEach((el) => {
        const p = parseInt(el.dataset.page, 10);
        el.classList.toggle('active', p === currentPage);
        if (pageThumbs[p] && !el.querySelector('img')) {
          el.textContent = '';
          const im = document.createElement('img');
          im.src = 'data:image/jpeg;base64,' + pageThumbs[p];
          el.appendChild(im);
        }
      });
    }
  }

  function updateTool(name) {
    currentTool = name;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('tool-' + name);
    if (btn) btn.classList.add('active');
    document.getElementById('infoTool').textContent = 'Tool: ' + name;
  }

  function updateColor(hex) {
    document.getElementById('colorPicker').value = hex;
    document.getElementById('colorLabel').textContent = hex;
  }

  function updateZoom(zoom) {
    document.getElementById('infoZoom').textContent = 'Zoom: ' + (zoom * 100).toFixed(0) + '%';
  }

  function setStatus(cls, label) {
    const dot = document.getElementById('statusDot');
    dot.className = cls;
    document.getElementById('statusLabel').textContent = label;
  }

  function showError(msg) {
    document.getElementById('errorMsg').textContent = msg;
  }

  function showConnectScreen() {
    document.getElementById('connectScreen').style.display = 'flex';
    document.getElementById('appScreen').classList.remove('visible');
  }

  function showAppScreen() {
    document.getElementById('connectScreen').style.display = 'none';
    document.getElementById('appScreen').classList.add('visible');
    pageThumbs = {};
  }

  // Restore last used host/port from localStorage
  (function () {
    const h = localStorage.getItem('ob_host');
    const p = localStorage.getItem('ob_port');
    if (h) document.getElementById('hostInput').value = h;
    if (p) document.getElementById('portInput').value = p;
  })();

  document.getElementById('hostInput').addEventListener('change', (e) => {
    localStorage.setItem('ob_host', e.target.value);
  });
  document.getElementById('portInput').addEventListener('change', (e) => {
    localStorage.setItem('ob_port', e.target.value);
  });
</script>
</body>
</html>
